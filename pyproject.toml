[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desligador"
version = "0.2.0"
description = "Desligue o PC com Windows pelo celular, com segurança, via Tailscale."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Felipe F Barros" }]
# O runtime usa só a biblioteca padrão (ver docs/decisoes/0003-runtime-sem-dependencias.md).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Felipefredbarros/desligador"

[project.scripts]
desligador = "desligador.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desligador = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
